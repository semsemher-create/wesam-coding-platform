<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>محرر الأكواد - منصة الوسام</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, Tahoma, sans-serif;
}

body {
    margin: 0;
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

header {
    background: #1e293b;
    padding: 14px 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
    flex-wrap: wrap;
}

header h1 {
    margin: 0;
    font-size: 19px;
}

.controls {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button,
select {

    padding: 10px 14px;

    border: none;

    border-radius: 7px;

    font-size: 14px;

    cursor: pointer;
}

select {
    background: white;
}

button {
    color: white;
}

.run {
    background: #16a34a;
}

.test {
    background: #9333ea;
}

.save {
    background: #0284c7;
}

.back {
    background: #64748b;
}

.workspace {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    padding: 10px;

    height: calc(100vh - 70px);
}

.panel {

    background: #1e293b;

    border-radius: 10px;

    overflow: hidden;

    display: flex;

    flex-direction: column;
}

.title {

    padding: 11px 14px;

    background: #334155;

    font-weight: bold;
}

textarea {

    flex: 1;

    width: 100%;

    resize: none;

    border: 0;

    outline: 0;

    padding: 18px;

    background: #020617;

    color: #e2e8f0;

    font: 16px/1.6 Consolas, monospace;

    direction: ltr;

    text-align: left;
}

iframe {

    flex: 1;

    border: 0;

    background: white;

    width: 100%;
}

#output {

    flex: 1;

    background: #020617;

    padding: 18px;

    overflow: auto;

    white-space: pre-wrap;

    font: 15px Consolas, monospace;

    direction: ltr;

    text-align: left;
}

.status {

    padding: 9px 14px;

    background: #111827;

    color: #cbd5e1;
}

.ok {
    color: #4ade80;
}

.err {
    color: #f87171;
}

.info {
    color: #7dd3fc;
}

.student {

    background: #0f766e;

    padding: 8px 12px;

    border-radius: 7px;

    font-size: 14px;
}

@media(max-width:800px) {

    .workspace {

        grid-template-columns: 1fr;

        height: auto;
    }

    .panel {

        height: 480px;
    }

}

</style>

</head>


<body>


<header>

<h1>
💻 منصة الوسام للبرمجة
</h1>


<div
    class="student"
    id="studentName">
جاري تحميل بيانات الطالب...
</div>


<div class="controls">

<select id="language">

<option value="html">
HTML
</option>

<option value="javascript">
JavaScript
</option>

<option value="python">
Python
</option>

</select>


<button
    class="run"
    onclick="runCode()">

▶ تشغيل

</button>


<button
    class="test"
    onclick="testCode()">

🧪 اختبار

</button>


<button
    class="save"
    onclick="saveSubmission()">

💾 حفظ الحل

</button>


<button
    class="back"
    onclick="goBack()">

↩ العودة

</button>

</div>

</header>


<div class="workspace">


<section class="panel">

<div class="title">

📝 اكتب الكود هنا

</div>


<textarea
    id="code">
</textarea>

</section>


<section class="panel">

<div class="title">

🖥️ النتيجة

</div>


<iframe
    id="preview"
    sandbox="allow-scripts"
    style="display:none">
</iframe>


<div id="output">

اضغط تشغيل لرؤية النتيجة.

</div>


<div
    id="status"
    class="status">

جاهز

</div>

</section>

</div>


<script>


/* ============================
   SUPABASE
============================ */


const SUPABASE_URL =
"https://oasopihyqihimusvxxgz.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rSyI387VFkKK9EhSxFR5uw_iMYddziS";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ============================
   عناصر الصفحة
============================ */


const codeBox =
document.getElementById("code");


const language =
document.getElementById("language");


const preview =
document.getElementById("preview");


const output =
document.getElementById("output");


const status =
document.getElementById("status");


const studentName =
document.getElementById("studentName");


/* ============================
   بيانات الطالب
============================ */


const studentId =
localStorage.getItem("studentId");


const savedName =
localStorage.getItem("studentName");


if (!studentId) {

    alert(
        "يجب تسجيل الدخول أولاً."
    );

    window.location.href =
        "index.html";

}


studentName.textContent =
savedName || "الطالب";


/* ============================
   أمثلة الأكواد
============================ */


const examples = {


html:

`<!DOCTYPE html>

<html>

<head>

<title>My Page</title>

</head>

<body>

<h1>بسم الله</h1>

<p>My first page.</p>

</body>

</html>`,



javascript:

`let name = "Student";

console.log("Hello " + name);`,



python:

`name = "Student"

print("Hello", name)`

};


/* ============================
   الحالة
============================ */


function setStatus(
    text,
    type = ""
) {

    status.textContent =
        text;

    status.className =
        "status " + type;

}


/* ============================
   تغيير اللغة
============================ */


function changeLanguage() {

    codeBox.value =
        examples[
            language.value
        ];

    preview.style.display =
        "none";

    output.style.display =
        "block";

    output.textContent =
        "اضغط تشغيل لرؤية النتيجة.";

    setStatus(
        "جاهز"
    );

}


/* ============================
   تشغيل الكود
============================ */


function runCode() {

    const lang =
        language.value;


    const code =
        codeBox.value;


    if (!code.trim()) {

        setStatus(
            "اكتب الكود أولاً.",
            "err"
        );

        return;

    }


    /* HTML */


    if (lang === "html") {

        preview.style.display =
            "block";

        output.style.display =
            "none";


        preview.srcdoc =
            code;


        setStatus(
            "✓ تم تشغيل HTML",
            "ok"
        );

        return;

    }


    /* JavaScript */


    if (
        lang ===
        "javascript"
    ) {

        preview.style.display =
            "none";

        output.style.display =
            "block";


        try {

            let logs = [];


            const fakeConsole = {

                log:
                (...args) => {

                    logs.push(
                        args.join(" ")
                    );

                },

                error:
                (...args) => {

                    logs.push(
                        "ERROR: " +
                        args.join(" ")
                    );

                }

            };


            new Function(
                "console",
                code
            )(
                fakeConsole
            );


            output.textContent =
                logs.length
                ?
                logs.join("\n")
                :
                "تم تنفيذ الكود بدون مخرجات.";


            setStatus(
                "✓ تم تشغيل JavaScript",
                "ok"
            );

        }

        catch(error) {

            output.textContent =
                error.toString();


            setStatus(
                "✗ يوجد خطأ في JavaScript",
                "err"
            );

        }


        return;

    }


    /* Python */


    if (
        lang ===
        "python"
    ) {

        runPython(
            code
        );

    }

}


/* ============================
   تشغيل Python
============================ */


async function runPython(
    code
) {

    output.style.display =
        "block";

    preview.style.display =
        "none";


    output.textContent =
        "جاري تحميل Python...";


    setStatus(
        "جاري تشغيل Python..."
    );


    try {

        if (
            !window.pyodide
        ) {

            await loadPyodide();

        }


        const result =
            await window.pyodide.runPythonAsync(
                code
            );


        output.textContent =
            result !== undefined
            ?
            String(result)
            :
            "تم تنفيذ الكود.";


        setStatus(
            "✓ تم تشغيل Python",
            "ok"
        );

    }


    catch(error) {

        output.textContent =
            error.toString();


        setStatus(
            "✗ يوجد خطأ في Python",
            "err"
        );

    }

}


/* ============================
   تحميل Python
============================ */


function loadPyodide() {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";


            script.onload =
                async function() {

                    try {

                        window.pyodide =
                            await window.loadPyodide(
                                {
                                    indexURL:
                                    "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"
                                }
                            );


                        resolve();

                    }

                    catch(error) {

                        reject(
                            error
                        );

                    }

                };


            script.onerror =
                reject;


            document.head.appendChild(
                script
            );

        }
    );

}


/* ============================
   اختبار الكود
============================ */


function testCode() {

    const lang =
        language.value;


    const code =
        codeBox.value.trim();


    if (!code) {

        setStatus(
            "اكتب الكود أولاً.",
            "err"
        );

        return false;

    }


    let passed = false;


    if (
        lang === "html"
    ) {

        passed =
            code.includes("<h1")
            &&
            code.includes("</h1>");

    }


    if (
        lang === "javascript"
    ) {

        passed =
            code.includes(
                "console.log"
            );

    }


    if (
        lang === "python"
    ) {

        passed =
            /\bprint\s*\(/.test(
                code
            );

    }


    output.style.display =
        "block";

    preview.style.display =
        "none";


    if (passed) {

        output.textContent =
            "✓ الاختبار ناجح!\nأحسنت.";


        setStatus(
            "✓ الاختبار ناجح",
            "ok"
        );

    }

    else {

        output.textContent =
            "✗ الاختبار غير ناجح.\nراجع المطلوب وحاول مرة أخرى.";


        setStatus(
            "✗ الاختبار غير ناجح",
            "err"
        );

    }


    return passed;

}


/* ============================
   حفظ الحل
============================ */


async function saveSubmission() {

    if (!studentId) {

        setStatus(
            "لم يتم التعرف على الطالب.",
            "err"
        );

        return;

    }


    const code =
        codeBox.value.trim();


    if (!code) {

        setStatus(
            "اكتب الكود أولاً.",
            "err"
        );

        return;

    }


    setStatus(
        "جاري حفظ الحل..."
    );


    const passed =
        testCode();


    const {

        data,
        error

    } = await db.rpc(

        "record_coding_submission",

        {

            p_student_id:
                studentId,

            p_task_id:
                null,

            p_language:
                language.value,

            p_source_code:
                code,

            p_test_status:
                passed
                ?
                "passed"
                :
                "failed",

            p_test_output:
                output.textContent,

            p_score:
                passed
                ?
                100
                :
                0

        }

    );


    if (error) {

        console.error(
            error
        );


        setStatus(
            "حدث خطأ أثناء حفظ الحل: " +
            error.message,
            "err"
        );


        return;

    }


    setStatus(
        "✓ تم حفظ الحل بنجاح",
        "ok"
    );


    alert(
        "تم حفظ الحل بنجاح في قاعدة البيانات."
    );

}


/* ============================
   العودة
============================ */


function goBack() {

    window.location.href =
        "index.html";

}


/* ============================
   اللغة الموجودة في الرابط
============================ */


const params =
new URLSearchParams(
    window.location.search
);


const selectedLanguage =
params.get(
    "language"
);


if (

    selectedLanguage ===
    "html"

    ||

    selectedLanguage ===
    "javascript"

    ||

    selectedLanguage ===
    "python"

) {

    language.value =
        selectedLanguage;

}


language.addEventListener(
    "change",
    changeLanguage
);


changeLanguage();


</script>

</body>

</html>
